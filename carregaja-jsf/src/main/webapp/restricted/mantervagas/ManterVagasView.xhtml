<ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <ui:define name="corpo">

    <f:event type="preRenderView" listener="#{manterVagasBean.inicializar}" />

    <h1>Vagas com carregador</h1>

    <h:form id="frmVagas">
      <p:messages id="messages" showDetail="false" closable="true">
        <p:autoUpdate />
      </p:messages>

      <p:panelGrid id="vagaGrid" columns="2" layout="grid"
        columnClasses="rotulo, campo">

        <p:outputLabel value="Identificação" for="identificacao" />
        <p:inputText id="identificacao" maxlength="20" required="true"
          requiredMessage="Informe a identificação da vaga."
          placeholder="G-01"
          value="#{manterVagasBean.vaga.identificacao}" />

        <p:outputLabel value="Potência do carregador" for="potencia" />
        <p:inputNumber id="potencia" decimalSeparator="," thousandSeparator="."
          decimalPlaces="1" symbol=" kW" symbolPosition="s"
          required="true" requiredMessage="Informe a potência do carregador."
          validatorMessage="A potência do carregador deve ser maior que zero."
          value="#{manterVagasBean.vaga.potenciaCarregador}">
          <f:validateDoubleRange minimum="0.1" />
        </p:inputNumber>

      </p:panelGrid>

      <p:commandButton icon="pi pi-save" id="salvarButton" value="Salvar"
        style="margin-top: 20px"
        actionListener="#{manterVagasBean.salvar}"
        update="@form" process="@this vagaGrid" />
      <p:commandButton icon="pi pi-times" id="limparButton" value="Limpar"
        style="margin: 20px 0 0 8px" styleClass="ui-button-secondary"
        actionListener="#{manterVagasBean.limpar}"
        update="@form" process="@this" />

      <p:dataTable id="vagas" var="item" value="#{manterVagasBean.vagas}"
        style="margin-top: 20px" reflow="true"
        emptyMessage="Nenhuma vaga cadastrada.">
        <p:column headerText="Vaga">#{item.identificacao}</p:column>
        <p:column headerText="Potência">
          <h:outputText value="#{item.potenciaCarregador}">
            <f:convertNumber minFractionDigits="1" maxFractionDigits="1" />
          </h:outputText> kW
        </p:column>
        <p:column headerText="Situação">#{item.ativa ? 'Ativa' : 'Desativada'}</p:column>
        <p:column headerText="Ações">
          <p:commandButton value="Alterar" update="@form" process="@this" styleClass="ui-button-flat"
            actionListener="#{manterVagasBean.editar(item)}" />
          <p:commandButton value="Desativar" rendered="#{item.ativa}" update="@form" process="@this"
            styleClass="ui-button-flat"
            actionListener="#{manterVagasBean.desativar(item)}" />
          <p:commandButton value="Reativar" rendered="#{!item.ativa}" update="@form" process="@this"
            styleClass="ui-button-flat"
            actionListener="#{manterVagasBean.reativar(item)}" />
          <p:commandButton value="Remover" update="@form" process="@this" styleClass="ui-button-flat"
            actionListener="#{manterVagasBean.remover(item)}">
            <p:confirm header="Remover vaga" message="Remover a vaga #{item.identificacao}?" icon="pi pi-exclamation-triangle" />
          </p:commandButton>
        </p:column>
      </p:dataTable>

      <p:confirmDialog global="true">
        <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" />
        <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" />
      </p:confirmDialog>
    </h:form>
  </ui:define>
</ui:composition>
