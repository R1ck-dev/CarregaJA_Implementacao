<ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <ui:define name="corpo">

    <f:event type="preRenderView" listener="#{definirTarifaBean.inicializar}" />

    <h1>Tarifa de energia</h1>

    <p>A nova tarifa vale a partir do momento do cadastro. As sessões já iniciadas continuam com a tarifa do início.</p>

    <h:form id="frmTarifa">
      <p:messages id="messages" showDetail="false" closable="true">
        <p:autoUpdate />
      </p:messages>

      <p:panelGrid id="tarifaGrid" columns="2" layout="grid"
        columnClasses="rotulo, campo">

        <p:outputLabel value="Valor do kWh" for="valor" />
        <p:inputNumber id="valor" decimalSeparator="," thousandSeparator="."
          decimalPlaces="4" symbol="R$ " symbolPosition="p"
          required="true" requiredMessage="Informe o valor do kWh."
          validatorMessage="O valor do kWh deve ser maior que zero."
          value="#{definirTarifaBean.valorKwh}">
          <f:validateDoubleRange minimum="0.0001" />
        </p:inputNumber>

      </p:panelGrid>

      <p:commandButton icon="pi pi-save" id="salvarButton" value="Cadastrar"
        style="margin-top: 20px"
        actionListener="#{definirTarifaBean.salvar}"
        update="@form" process="@this tarifaGrid" />

      <p:dataTable id="tarifas" var="tarifa" value="#{definirTarifaBean.tarifas}"
        style="margin-top: 20px" reflow="true"
        emptyMessage="Nenhuma tarifa cadastrada.">
        <p:column headerText="Valor do kWh">
          R$ <h:outputText value="#{tarifa.valorKwh}">
            <f:convertNumber minFractionDigits="2" maxFractionDigits="4" />
          </h:outputText>
        </p:column>
        <p:column headerText="Vigente desde">
          <h:outputText value="#{tarifa.inicioVigencia}">
            <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm" />
          </h:outputText>
        </p:column>
        <p:column headerText="Cadastrada por">#{tarifa.nomeResponsavel}</p:column>
      </p:dataTable>
    </h:form>
  </ui:define>
</ui:composition>
